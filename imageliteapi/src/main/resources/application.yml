spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/imagelite #aqui tem que ser o endereço da porta do computador que o docker está
    username: postgres
    password: postgres
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true #mostrara o sql no log
  servlet:
    multipart:
      #abaixo é definido o tamaho máximo de um arquivo que será salvo
      max-file-size: 20MB
      max-request-size: 20MB

#Production
---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/imagelite #aqui tem que ser o endereço da porta do computador que o docker está
